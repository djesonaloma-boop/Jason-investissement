<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JASON INVEST — Connexion</title>

<link rel="stylesheet" href="./style.css">

<style>
/* =========================================================
   JASON INVEST
   INDEX — ANIMATION
========================================================= */

:root{
    --bg:#030711;
    --bg2:#07111f;
    --card:rgba(10,20,36,.88);
    --gold:#d8b45a;
    --gold-light:#f1d98b;
    --text:#ffffff;
    --muted:#8997aa;
    --border:rgba(216,180,90,.18);
    --green:#5ee49a;
    --red:#ff7c8d;
    --blue:#6db8ff;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    overflow-x:hidden;
    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 15% 20%,rgba(216,180,90,.09),transparent 25%),
        radial-gradient(circle at 85% 75%,rgba(69,130,255,.08),transparent 28%),
        linear-gradient(135deg,#030711,#07111f 50%,#040914);
}

/* =========================================================
   FOND ANIMÉ
========================================================= */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.glow{
    position:absolute;
    width:320px;
    height:320px;
    border-radius:50%;
    filter:blur(70px);
    opacity:.18;
    animation:glowMove 10s ease-in-out infinite alternate;
}

.glow.one{
    top:-120px;
    left:-100px;
    background:#d8b45a;
}

.glow.two{
    right:-120px;
    bottom:-120px;
    background:#386cff;
    animation-delay:2s;
}

.glow.three{
    top:45%;
    left:50%;
    width:180px;
    height:180px;
    background:#9c6cff;
    animation-delay:4s;
}

@keyframes glowMove{
    from{
        transform:translate(0,0) scale(1);
    }
    to{
        transform:translate(80px,40px) scale(1.25);
    }
}

/* PARTICULES */

.particles{
    position:absolute;
    inset:0;
}

.particle{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:var(--gold-light);
    opacity:0;
    animation:particleFloat linear infinite;
}

@keyframes particleFloat{
    0%{
        transform:translateY(110vh) scale(.4);
        opacity:0;
    }
    10%{
        opacity:.7;
    }
    90%{
        opacity:.4;
    }
    100%{
        transform:translateY(-10vh) scale(1);
        opacity:0;
    }
}

/* =========================================================
   PAGE
========================================================= */

.auth-page{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px 15px;
}

.auth-wrapper{
    width:100%;
    max-width:440px;
    animation:pageAppear .8s ease;
}

@keyframes pageAppear{
    from{
        opacity:0;
        transform:translateY(30px) scale(.97);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* =========================================================
   CARD
========================================================= */

.auth-card{
    position:relative;
    width:100%;
    padding:30px 24px;
    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.015)
        ),
        var(--card);

    border:1px solid var(--border);

    box-shadow:
        0 30px 90px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.04);

    backdrop-filter:blur(18px);
    overflow:hidden;
}

.auth-card::before{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    right:-100px;
    top:-100px;
    border-radius:50%;
    border:1px solid rgba(216,180,90,.15);
    animation:rotateRing 12s linear infinite;
}

.auth-card::after{
    content:"";
    position:absolute;
    width:120px;
    height:120px;
    left:-70px;
    bottom:-70px;
    border-radius:50%;
    border:1px solid rgba(216,180,90,.10);
    animation:rotateRing 9s linear infinite reverse;
}

@keyframes rotateRing{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   LOGO
========================================================= */

.logo-area{
    position:relative;
    text-align:center;
    margin-bottom:18px;
}

.logo{
    position:relative;
    width:76px;
    height:76px;
    margin:auto;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            var(--gold-light),
            var(--gold)
        );

    color:#07101d;
    font-size:24px;
    font-weight:900;

    box-shadow:
        0 12px 35px rgba(216,180,90,.20);

    animation:
        logoFloat 3s ease-in-out infinite,
        logoGlow 2.5s ease-in-out infinite alternate;
}

.logo::before{
    content:"";
    position:absolute;
    inset:-7px;
    border:1px solid rgba(216,180,90,.30);
    border-radius:29px;
    animation:ringPulse 2.5s ease-in-out infinite;
}

@keyframes logoFloat{
    0%,100%{
        transform:translateY(0) rotate(0deg);
    }
    50%{
        transform:translateY(-6px) rotate(2deg);
    }
}

@keyframes logoGlow{
    from{
        box-shadow:0 10px 30px rgba(216,180,90,.12);
    }
    to{
        box-shadow:0 15px 45px rgba(216,180,90,.30);
    }
}

@keyframes ringPulse{
    0%,100%{
        transform:scale(1);
        opacity:.35;
    }
    50%{
        transform:scale(1.08);
        opacity:.8;
    }
}

/* =========================================================
   TITRE
========================================================= */

.title{
    text-align:center;
    margin:0;
    font-size:29px;
    letter-spacing:1.5px;
}

.title span{
    color:var(--gold-light);
}

.subtitle{
    text-align:center;
    color:var(--muted);
    margin:8px 0 24px;
    font-size:14px;
}

/* petit séparateur */

.gold-line{
    width:65px;
    height:3px;
    margin:0 auto 25px;
    border-radius:20px;
    background:linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
    );
}

/* =========================================================
   SWITCH
========================================================= */

.switch-area{
    text-align:center;
    margin-top:22px;
}

.switch-text{
    color:var(--muted);
    font-size:13px;
}

.switch-button{
    margin-top:5px;
    border:0;
    background:transparent;
    color:var(--gold-light);
    font-size:14px;
    cursor:pointer;
    text-decoration:underline;
}

.switch-button:hover{
    color:#fff;
}

/* =========================================================
   FORM
========================================================= */

.form-section{
    display:none;
    animation:formAppear .4s ease;
}

.form-section.active{
    display:block;
}

@keyframes formAppear{
    from{
        opacity:0;
        transform:translateX(15px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

.form-title{
    text-align:center;
    font-size:20px;
    margin:0 0 20px;
}

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    color:#c9d2df;
    font-size:13px;
}

.form-group input{
    display:block;
    width:100%;
    height:49px;
    padding:0 14px;

    border-radius:12px;
    border:1px solid #26384f;

    outline:none;

    background:#06101d;
    color:#fff;

    font-size:14px;

    transition:
        border-color .25s,
        box-shadow .25s,
        transform .25s;
}

.form-group input:focus{
    border-color:var(--gold);
    box-shadow:
        0 0 0 3px rgba(216,180,90,.08),
        0 8px 20px rgba(0,0,0,.12);

    transform:translateY(-1px);
}

.form-group input::placeholder{
    color:#607087;
}

/* =========================================================
   CONDITIONS
========================================================= */

.terms{
    display:flex;
    align-items:flex-start;
    gap:8px;
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
}

.terms input{
    margin-top:3px;
    accent-color:var(--gold);
}

/* =========================================================
   BOUTON
========================================================= */

.main-button{
    position:relative;
    width:100%;
    height:50px;

    border:0;
    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            var(--gold),
            var(--gold-light)
        );

    color:#07101d;

    font-weight:900;
    font-size:15px;

    cursor:pointer;

    overflow:hidden;

    box-shadow:
        0 10px 30px rgba(216,180,90,.15);

    transition:
        transform .2s,
        box-shadow .2s;
}

.main-button::before{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:70%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.45),
            transparent
        );

    transform:skewX(-20deg);
    animation:buttonShine 3.5s infinite;
}

@keyframes buttonShine{
    0%,45%{
        left:-120%;
    }
    65%,100%{
        left:150%;
    }
}

.main-button:hover{
    transform:translateY(-2px);
    box-shadow:
        0 15px 35px rgba(216,180,90,.25);
}

.main-button:disabled{
    opacity:.55;
    cursor:not-allowed;
    transform:none;
}

/* =========================================================
   MOT DE PASSE OUBLIÉ
========================================================= */

.forgot{
    display:block;
    text-align:right;
    margin-top:9px;
    margin-bottom:4px;

    color:var(--gold-light);
    font-size:12px;
    text-decoration:none;
}

.forgot:hover{
    text-decoration:underline;
}

/* =========================================================
   MESSAGE
========================================================= */

.message{
    display:none;
    padding:12px;
    margin-bottom:17px;
    border-radius:11px;
    text-align:center;
    font-size:13px;
    line-height:1.5;
    animation:messageAppear .35s ease;
}

.message.show{
    display:block;
}

@keyframes messageAppear{
    from{
        opacity:0;
        transform:translateY(-8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message.success{
    background:rgba(40,167,69,.12);
    color:var(--green);
    border:1px solid rgba(40,167,69,.25);
}

.message.error{
    background:rgba(220,53,69,.12);
    color:var(--red);
    border:1px solid rgba(220,53,69,.25);
}

.message.info{
    background:rgba(23,162,184,.12);
    color:#71d9e8;
    border:1px solid rgba(23,162,184,.25);
}

/* =========================================================
   BADGES
========================================================= */

.features{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
    margin-top:20px;
}

.feature{
    padding:6px 9px;
    border-radius:20px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.06);
    color:#8e9bad;
    font-size:10px;
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
    text-align:center;
    margin-top:17px;
    color:#526176;
    font-size:11px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:480px){

    .auth-page{
        padding:15px;
        align-items:center;
    }

    .auth-card{
        padding:27px 18px;
        border-radius:20px;
    }

    .title{
        font-size:25px;
    }

    .logo{
        width:68px;
        height:68px;
    }

    .features{
        gap:5px;
    }
}
</style>
</head>

<body>

<!-- =========================================================
     FOND ANIMÉ
========================================================= -->

<div class="background">

    <div class="glow one"></div>
    <div class="glow two"></div>
    <div class="glow three"></div>

    <div class="particles" id="particles"></div>

</div>


<!-- =========================================================
     AUTH
========================================================= -->

<main class="auth-page">

    <div class="auth-wrapper">

        <div class="auth-card">

            <!-- LOGO -->
            <div class="logo-area">

                <div class="logo">
                    JI
                </div>

            </div>


            <!-- TITRE -->

            <h1 class="title">
                JASON <span>INVEST</span>
            </h1>

            <p class="subtitle">
                Votre espace personnel
            </p>

            <div class="gold-line"></div>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message">
            </div>


            <!-- =================================================
                 CONNEXION
            ================================================= -->

            <section
                id="connexionSection"
                class="form-section active">

                <h2 class="form-title">
                    Connexion
                </h2>

                <form id="connexionForm">

                    <div class="form-group">

                        <label for="connexionEmail">
                            Adresse Gmail / E-mail
                        </label>

                        <input
                            type="email"
                            id="connexionEmail"
                            placeholder="exemple@gmail.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="connexionPassword">
                            Mot de passe
                        </label>

                        <input
                            type="password"
                            id="connexionPassword"
                            placeholder="Votre mot de passe"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <a
                        href="#"
                        id="forgotPassword"
                        class="forgot">

                        Mot de passe oublié ?

                    </a>


                    <button
                        type="submit"
                        id="connexionButton"
                        class="main-button">

                        Se connecter

                    </button>

                </form>


                <div class="switch-area">

                    <div class="switch-text">
                        Vous n'avez pas encore de compte ?
                    </div>

                    <button
                        type="button"
                        id="showInscription"
                        class="switch-button">

                        Créer un compte

                    </button>

                </div>

            </section>


            <!-- =================================================
                 INSCRIPTION
            ================================================= -->

            <section
                id="inscriptionSection"
                class="form-section">

                <h2 class="form-title">
                    Créer un compte
                </h2>

                <form id="inscriptionForm">


                    <div class="form-group">

                        <label for="name">
                            Nom complet
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Votre nom complet"
                            autocomplete="name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Numéro de téléphone
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="+243..."
                            autocomplete="tel"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Adresse Gmail / E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="exemple@gmail.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Mot de passe
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Créer un mot de passe"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="passwordConfirm">
                            Confirmer le mot de passe
                        </label>

                        <input
                            type="password"
                            id="passwordConfirm"
                            placeholder="Répéter le mot de passe"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="referral">
                            Code de parrainage
                            <span style="color:#637188;">
                                (facultatif)
                            </span>
                        </label>

                        <input
                            type="text"
                            id="referral"
                            placeholder="Ex. JAS-XXXXXX"
                        >

                    </div>


                    <div class="form-group">

                        <label class="terms">

                            <input
                                type="checkbox"
                                id="terms"
                                required
                            >

                            <span>
                                J'accepte les conditions
                                d'utilisation de JASON INVEST.
                            </span>

                        </label>

                    </div>


                    <button
                        type="submit"
                        id="inscriptionButton"
                        class="main-button">

                        Créer mon compte

                    </button>

                </form>


                <div class="switch-area">

                    <div class="switch-text">
                        Vous avez déjà un compte ?
                    </div>

                    <button
                        type="button"
                        id="showConnexion"
                        class="switch-button">

                        Se connecter

                    </button>

                </div>

            </section>


            <!-- =================================================
                 PETITES INFORMATIONS
            ================================================= -->

            <div class="features">

                <span class="feature">
                    🔐 Sécurisé
                </span>

                <span class="feature">
                    📱 Mobile
                </span>

                <span class="feature">
                    ⚡ Rapide
                </span>

                <span class="feature">
                    🔔 Notifications
                </span>

            </div>

        </div>


        <div class="footer">
            © <span id="year"></span> JASON INVEST
        </div>

    </div>

</main>


<script src="./app.js"></script>


<script>
"use strict";

/* =========================================================
   JASON INVEST — INDEX CONTROLLER
========================================================= */

const API = "/api";

const $ = (id) =>
    document.getElementById(id);


/* =========================================================
   ANNÉE
========================================================= */

$("year").textContent =
    new Date().getFullYear();


/* =========================================================
   PARTICULES
========================================================= */

const particles =
    $("particles");

for(let i = 0; i < 32; i++){

    const particle =
        document.createElement("span");

    particle.className =
        "particle";

    particle.style.left =
        Math.random() * 100 + "%";

    particle.style.animationDuration =
        (7 + Math.random() * 9) + "s";

    particle.style.animationDelay =
        (-Math.random() * 12) + "s";

    particle.style.opacity =
        Math.random() * .6;

    particles.appendChild(particle);
}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text,type){

    const box =
        $("message");

    box.textContent =
        text;

    box.className =
        "message show " + type;
}


function hideMessage(){

    $("message").textContent = "";

    $("message").className =
        "message";
}


/* =========================================================
   CHANGER DE FORMULAIRE
========================================================= */

$("showInscription")
.addEventListener("click",function(){

    $("connexionSection")
        .classList.remove("active");

    $("inscriptionSection")
        .classList.add("active");

    hideMessage();

});


$("showConnexion")
.addEventListener("click",function(){

    $("inscriptionSection")
        .classList.remove("active");

    $("connexionSection")
        .classList.add("active");

    hideMessage();

});


/* =========================================================
   API REQUEST
========================================================= */

async function apiRequest(path,options = {}){

    const response =
        await fetch(
            API + path,
            {
                credentials:"include",
                ...options,
                headers:{
                    "Content-Type":
                        "application/json",
                    ...(options.headers || {})
                }
            }
        );

    const data =
        await response
            .json()
            .catch(() => ({}));

    if(!response.ok){

        throw new Error(
            data.message ||
            data.error ||
            "Une erreur est survenue."
        );

    }

    return data;
}


/* =========================================================
   VÉRIFIER SI L'UTILISATEUR EST DÉJÀ CONNECTÉ
========================================================= */

async function checkExistingSession(){

    try{

        const data =
            await apiRequest(
                "/auth/me",
                {
                    method:"GET"
                }
            );

        if(data && data.user){

            window.location.href =
                "dashboard.html";

        }

    }catch(error){

        /*
         * Pas connecté :
         * on reste sur index.html.
         */

    }

}


/* =========================================================
   CONNEXION
========================================================= */

$("connexionForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const email =
            $("connexionEmail")
            .value
            .trim()
            .toLowerCase();

        const password =
            $("connexionPassword")
            .value;

        if(!email || !password){

            showMessage(
                "Veuillez remplir tous les champs.",
                "error"
            );

            return;
        }

        const button =
            $("connexionButton");

        button.disabled = true;

        button.textContent =
            "Connexion...";

        try{

            const data =
                await apiRequest(
                    "/auth/login",
                    {
                        method:"POST",

                        body:JSON.stringify({
                            email:email,
                            password:password
                        })
                    }
                );

            showMessage(
                data.message ||
                "Connexion réussie.",
                "success"
            );

            /*
             * La session est créée par le serveur.
             * credentials:include permet au navigateur
             * de conserver le cookie HttpOnly.
             */

            setTimeout(function(){

                window.location.href =
                    "dashboard.html";

            },700);

        }catch(error){

            showMessage(
                error.message ||
                "Impossible de se connecter.",
                "error"
            );

            button.disabled = false;

            button.textContent =
                "Se connecter";
        }

    }
);


/* =========================================================
   INSCRIPTION
========================================================= */

$("inscriptionForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const name =
            $("name")
            .value
            .trim();

        const phone =
            $("phone")
            .value
            .trim();

        const email =
            $("email")
            .value
            .trim()
            .toLowerCase();

        const password =
            $("password")
            .value;

        const passwordConfirm =
            $("passwordConfirm")
            .value;

        const referral =
            $("referral")
            .value
            .trim()
            .toUpperCase();

        const terms =
            $("terms")
            .checked;


        if(!name || !phone || !email){

            showMessage(
                "Veuillez remplir tous les champs obligatoires.",
                "error"
            );

            return;
        }


        if(password.length < 6){

            showMessage(
                "Le mot de passe doit contenir au moins 6 caractères.",
                "error"
            );

            return;
        }


        if(password !== passwordConfirm){

            showMessage(
                "Les deux mots de passe ne correspondent pas.",
                "error"
            );

            return;
        }


        if(!terms){

            showMessage(
                "Vous devez accepter les conditions d'utilisation.",
                "error"
            );

            return;
        }


        const button =
            $("inscriptionButton");

        button.disabled = true;

        button.textContent =
            "Création du compte...";


        try{

            const data =
                await apiRequest(
                    "/auth/register",
                    {
                        method:"POST",

                        body:JSON.stringify({

                            name:name,

                            phone:phone,

                            email:email,

                            password:password,

                            referral_code:
                                referral || null

                        })
                    }
                );


            showMessage(
                data.message ||
                "Compte créé avec succès.",
                "success"
            );


            setTimeout(function(){

                window.location.href =
                    "dashboard.html";

            },900);


        }catch(error){

            showMessage(
                error.message ||
                "Impossible de créer le compte.",
                "error"
            );

            button.disabled = false;

            button.textContent =
                "Créer mon compte";
        }

    }
);


/* =========================================================
   MOT DE PASSE OUBLIÉ
========================================================= */

$("forgotPassword")
.addEventListener(
    "click",
    async function(event){

        event.preventDefault();

        const email =
            $("connexionEmail")
            .value
            .trim()
            .toLowerCase();


        if(!email){

            showMessage(
                "Entrez d'abord votre adresse e-mail.",
                "info"
            );

            $("connexionEmail").focus();

            return;
        }


        try{

            showMessage(
                "Envoi de la demande...",
                "info"
            );


            const data =
                await apiRequest(
                    "/auth/forgot-password",
                    {
                        method:"POST",

                        body:JSON.stringify({
                            email:email
                        })
                    }
                );


            showMessage(
                data.message ||
                "Si ce compte existe, les instructions seront envoyées.",
                "success"
            );


        }catch(error){

            showMessage(
                error.message ||
                "Impossible de traiter la demande.",
                "error"
            );

        }

    }
);


/* =========================================================
   INITIALISATION
========================================================= */

checkExistingSession();

</script>
